# ICVL stores 31-band HRHS on the standard 400--700 nm grid; HRMS/LRHS are
# materialized from the bundled Nikon D700 SRF and Gaussian x4 degradation.
spectral:
  name: tabulated_srf
  sensor: nikon_d700
  response_file: Nikon_D700_srf.mat
  wavelength_start_nm: 400.0
  wavelength_end_nm: 700.0
  num_hsi_bands: 31
  num_msi_bands: 3
spatial:
  name: gaussian_decimation
  scale: 4
  kernel_size: 9
  sigma: 2.0
  padding: reflect
  offset: [ 0, 0 ]
