# @package _global_

defaults:
- /dataset: chikusei
- /degradation: chikusei_wv2_x4
- _self_

experiment:
  name: mctnet_chikusei_x4

model:
  name: MCTNet
  params:
    hsi_channels: 128
    msi_channels: 8
    scale: 4
    base_hr_size: 64
    transformer_depth: 5
    transformer_heads: 8
    transformer1_dim: 128
    transformer2_dim: 64
    dropout: 0.1
    attention_dropout: 0.1
  inference:
    mode: full

training:
  trainer:
    max_epochs: 200
    check_val_every_n_epoch: 5
    log_every_n_steps: 10
    progress_bar: true
  optimizer:
    name: adam
    lr: 0.0001
    betas: [ 0.9, 0.999 ]
    weight_decay: 0.0
  scheduler:
    name: none
  loss:
    reconstruction:
    - name: l2
      alias: fusion_reconstruction
      weight: 1.0
    regularization:
    - name: spatial_edge
      alias: spatial_edge
      weight: 0.5
      params:
        criterion: mse
    - name: spectral_edge
      alias: spectral_edge
      weight: 0.5
      params:
        criterion: mse
  dataloader:
    materialization_batch_size: 8
    train:
      batch_size: 16
      shuffle: true
      pin_memory: true
      num_workers: 0
    valid:
      batch_size: 16
      shuffle: false
      pin_memory: true
      num_workers: 0
    test:
      batch_size: 1
      shuffle: false
      pin_memory: true
      num_workers: 0
  checkpoint:
    monitor: val/psnr_global
    mode: max
    uses_validation_gt: true
