# @package _global_

defaults:
- /dataset: chikusei
- /degradation: chikusei_wv2_x4
- _self_

experiment:
  name: cgsfn_chikusei_x4

model:
  name: CGSFN
  params:
    hsi_channels: 128
    msi_channels: 8
    scale: 4
  # Cross-modal attention at the first encoder level is quadratic in the
  # feature-map area, so the 256x256 test scenes cannot be fused whole.
  # 64/16 reproduces the upstream sliding-window protocol, which validates
  # with training_size=64 and stride=32.
  inference:
    mode: tiled
    tile_size: 64
    shave: 16

training:
  trainer:
    max_epochs: 200
    check_val_every_n_epoch: 5
    log_every_n_steps: 10
    progress_bar: true
  optimizer:
    name: adam
    lr: 0.0001
    betas: [ 0.9, 0.999 ]
    weight_decay: 0.0
  scheduler:
    name: none
  loss:
    reconstruction:
    - name: l1
      alias: reconstruction
      weight: 1.0
    regularization: []
  dataloader:
    materialization_batch_size: 8
    train:
      batch_size: 16
      shuffle: true
      pin_memory: true
      num_workers: 0
    valid:
      batch_size: 16
      shuffle: false
      pin_memory: true
      num_workers: 0
    test:
      batch_size: 1
      shuffle: false
      pin_memory: true
      num_workers: 0
  checkpoint:
    monitor: val/psnr_global
    mode: max
    uses_validation_gt: true
