[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsmsfusion"
version = "0.1.0"
description = "Configuration-driven hyperspectral and multispectral image fusion toolbox"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.9",
    "hydra-core>=1.3,<1.4",
    "lightning>=2.4,<2.7",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "omegaconf>=2.3,<2.4",
    "rich>=13.7",
    "scipy>=1.10",
    "tensorboard>=2.14",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hsmsfusion = "hsmsfusion.cli:main"

[tool.setuptools.packages.find]
include = ["hsmsfusion*"]

[tool.setuptools.package-data]
"hsmsfusion.degradations" = ["srf/*.mat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
