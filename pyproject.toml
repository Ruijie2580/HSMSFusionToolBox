[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsmsfusion"
version = "0.1.0"
description = "Configuration-driven hyperspectral and multispectral image fusion toolbox"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.9",
    "hydra-core>=1.3,<1.4",
    "lightning>=2.4,<2.7",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "omegaconf>=2.3,<2.4",
    "rich>=13.7",
    "scipy>=1.10",
    "tensorboard>=2.14",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hsmsfusion = "hsmsfusion.cli:main"

[tool.setuptools.packages.find]
include = ["hsmsfusion*"]

[tool.setuptools.package-data]
"hsmsfusion.degradations" = ["srf/*.mat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
extend-ignore = ["E501"] # 存量长行过多，不整体重排

[tool.ruff.lint.per-file-ignores]
# 上游论文移植文件，保持与源码贴近；不重排 import、不清理其死代码/空白风格。
"hsmsfusion/models/**" = [
    "E401", "E402", "E701", "E702", "E741",
    "F811", "F821", "F841", "F901", "F401",
    "I001", "W291", "W292", "W293",
]
